# Single configuration entry point. Defaults deliver the accepted vendor setup.
mode: vendor                  # vendor | full

vendor:
  ws_path: /cyber_gf/voice    # public path, must not change (vendor sender depends on it)

emotion:
  enabled: true               # used in full mode only
  default: neutral            # used on timeout / failure / too-short text
  udp_host: 127.0.0.1
  udp_port: 8102              # TBD (to be confirmed)
  timeout_ms: 300             # TBD (to be confirmed)

downstream:
  host: 127.0.0.1
  port: 8100                  # TBD (to be confirmed)
  transport: framed           # framed (TCP BEGIN/AUDIO/END) | http (legacy chunked POST)
  enabled: true

livetalking:
  url: http://127.0.0.1:8010

intake:
  mic:                        # full mode: streaming microphone (WS /ws/audio, PCM16 16 kHz mono)
    enabled: true
    host: 127.0.0.1
    port: 8021                  # TBD (to be confirmed)

vad:                          # sentence cut-off, values of the early voice pipeline
  frame_ms: 20
  vad_aggressiveness: 2
  end_silence_ms: 900
  min_utterance_ms: 400
  max_utterance_ms: 15000
  pre_pad_ms: 300
  calibration_ms: 500
  energy_gate_factor: 3.0
  min_noise_floor: 60.0
  coalesce_ms: 1000
